name: Deploy PhoenixGCode PWA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compilar Wheel de PhoenixGCode (.whl)
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          # Copiar el .whl dentro del directorio del frontend web
          mkdir -p frontends/web/dist
          cp dist/*.whl frontends/web/dist/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cargar Artifacts de la Web PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontends/web'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4