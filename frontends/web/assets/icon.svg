<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Gradiente Oscuro -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gradiente Fuego Fénix -->
    <linearGradient id="phoenixGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Gradiente Cian Tech (G-Code) -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow suave para el Fénix -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f97316" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Contenedor Base con Bordes Redondeados (App Icon) -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <g filter="url(#glow)">
    <!-- Alas y Cuerpo del Fénix -->
    <!-- Ala Izquierda -->
    <path d="M 256 310 C 210 270 110 240 70 140 C 120 160 170 190 210 230 C 200 180 170 130 130 90 C 190 120 230 170 246 220 Z" 
          fill="url(#phoenixGrad)"/>
    
    <!-- Ala Derecha -->
    <path d="M 256 310 C 302 270 402 240 442 140 C 392 160 342 190 302 230 C 312 180 342 130 382 90 C 322 120 282 170 266 220 Z" 
          fill="url(#phoenixGrad)"/>

    <!-- Cabeza y Llama Central -->
    <path d="M 256 120 C 240 160 248 190 256 220 C 264 190 272 160 256 120 Z" fill="#fef08a"/>
    <circle cx="256" cy="110" r="12" fill="#fbbf24"/>

    <!-- Boquilla de Extrusión Central (Nozzle) -->
    <path d="M 236 290 L 276 290 L 276 320 L 262 345 L 250 345 L 236 320 Z" fill="#f1f5f9"/>
    <rect x="252" y="345" width="8" height="12" fill="#38bdf8"/>
  </g>

  <!-- Capas de Impresión 3D (G-Code Layer Lines) -->
  <g stroke="url(#techGrad)" stroke-linecap="round">
    <!-- Capa 1 (Base) -->
    <line x1="120" y1="410" x2="392" y2="410" stroke-width="12" opacity="0.4"/>
    <!-- Capa 2 -->
    <line x1="140" y1="390" x2="372" y2="390" stroke-width="10" opacity="0.7"/>
    <!-- Capa 3 (Interrumpida / Recovery Point) -->
    <line x1="170" y1="370" x2="230" y2="370" stroke-width="8"/>
    <line x1="282" y1="370" x2="342" y2="370" stroke-width="8"/>
  </g>

  <!-- Punto de Conexión / Boquilla imprimiendo capa -->
  <circle cx="256" cy="370" r="6" fill="#38bdf8"/>
</svg>
